name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 创建 Release 与上传产物

jobs:
  release:
    name: release (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: targz
          - os: macos-latest
            rid: osx-arm64
            archive: targz
          - os: macos-latest
            rid: osx-x64
            archive: targz

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test WulingFilmPicking.slnx -c Release -v q

      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish src/Wuling.App -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:DebugSymbols=false
          -o "artifacts/${{ matrix.rid }}"

      # 发布产物完整性: Python 引擎与插件必须随包(Content 落盘, 04 §4.5)
      - name: Verify bundle layout
        shell: bash
        run: |
          d="artifacts/${{ matrix.rid }}"
          test -f "$d/plugins/python/wuling_worker.py"
          test -f "$d/plugins/python/wuling_sdk.py"
          test -f "$d/plugins/python/histogram/plugin.json"
          ls "$d"

      # macOS: 组装 .app bundle(未签名/ad-hoc;Gatekeeper 首次需右键打开)
      - name: Assemble macOS .app bundle
        if: startsWith(matrix.rid, 'osx')
        shell: bash
        run: |
          rid="${{ matrix.rid }}"
          app="WulingFilmPicking.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R "artifacts/$rid/." "$app/Contents/MacOS/"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>WulingFilmPicking</string>
            <key>CFBundleIdentifier</key><string>com.wuling.film-picking</string>
            <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleExecutable</key><string>Wuling.App</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict>
          </plist>
          EOF
          chmod +x "$app/Contents/MacOS/Wuling.App"
          # 可执行文件需要 plugins 相对自身目录(Codesign ad-hoc 保持内容可改写)
          codesign --force --deep -s - "$app" || true
          tar -czf "WulingFilmPicking-$rid.tar.gz" "$app"
          sha256sum "WulingFilmPicking-$rid.tar.gz" > "WulingFilmPicking-$rid.tar.gz.sha256"

      - name: Pack archive (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          cd artifacts/linux-x64
          chmod +x Wuling.App
          tar -czf ../../WulingFilmPicking-linux-x64.tar.gz .
          cd ../..
          sha256sum WulingFilmPicking-linux-x64.tar.gz > WulingFilmPicking-linux-x64.tar.gz.sha256

      - name: Pack archive (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath WulingFilmPicking-win-x64.zip
          $h = (Get-FileHash WulingFilmPicking-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  WulingFilmPicking-win-x64.zip" | Out-File -Encoding ascii WulingFilmPicking-win-x64.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WulingFilmPicking-${{ matrix.rid }}
          path: |
            WulingFilmPicking-*
            !artifacts/

  github-release:
    name: GitHub Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/WulingFilmPicking-*
